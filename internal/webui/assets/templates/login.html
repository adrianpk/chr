{{define "login.html"}}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in - chr</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/chr.css">
  </head>
  <body>
    <main class="login-page">
      <section class="login-card">
        <img class="login-logo" src="/assets/chr-logo-alpha.png" alt="">
        <h1>chr</h1>
        <p>Log in to your workspace.</p>
        {{if .Error}}<p role="alert">{{.Error}}</p>{{end}}
        <form class="action-form" method="post" action="/login">
          <input type="hidden" name="next" value="{{.Next}}">
          <label><span>Username</span><input name="username" autocomplete="username" maxlength="80" required autofocus></label>
          <label><span>Password</span><input name="password" type="password" autocomplete="current-password" maxlength="1024" required></label>
          <button class="button button--primary" type="submit">Log in</button>
        </form>
      </section>
    </main>
  </body>
</html>
{{end}}
